<!doctype html><meta charset="utf-8"><title>Disabled</title>
<style>body{margin:16px;font:16px sans-serif}*{margin:4px}</style>
<button>Enabled button</button>
<button disabled>Disabled button</button>
<input type="text" aria-label="Disabled input" disabled>
<fieldset disabled><legend>Locked</legend><input type="text" aria-label="Fieldset input"></fieldset>
<div role="button" aria-disabled="true">Aria disabled</div>
<select disabled aria-label="Disabled select"><option>x</option></select>
