[project]
name = "tiny-grounder"
version = "0.1.0"
license = "MIT"
description = "A tiny on-device UI grounding model: instruction or goal + UI elements -> ranked elements."
requires-python = ">=3.12,<3.13"
dependencies = [
    "numpy>=1.26",
    "onnxruntime>=1.18",
    "tokenizers>=0.19",
]

[project.optional-dependencies]
train = [
    "torch>=2.4",
    "onnx>=1.16",
    "pyyaml>=6",
    "rank-bm25>=0.2.2",
    "tldextract>=5",
    "httpx>=0.27",
    "playwright>=1.45",
    "lxml>=5",
    "ijson>=3.2",
]
baselines = [
    "transformers>=4.40",
]
datasets-convert = [
    "pyarrow>=15",
    "fsspec>=2024.1",
    "aiohttp>=3.9",
    "httpx>=0.27",
]
demo = [
    "anthropic>=2",
    "mcp>=1.2,<2",
    "playwright>=1.45",
    "pyyaml>=6",
    "rank-bm25>=0.2.2",
]

tool = [
    "mcp>=1.2,<2",
    "playwright>=1.45",
    "rank-bm25>=0.2.2",
]

[project.scripts]
grounder-tool = "grounder_tool.mcp:main"

[dependency-groups]
dev = ["pytest>=8"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["grounder", "grounder_tool"]
exclude = ["**/.build", "**/.build/**"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
