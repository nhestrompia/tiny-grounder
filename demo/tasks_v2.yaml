# Agent benchmark v2 (plan v2.1, step 7): frozen, held-out, read-only tasks.
#
# Sites are not training domains (data/leakage/heldout_domains.txt), not demo/tasks.yaml domains and not sites of the
# human-eval pages (data/heldout/{select,confirm}_pages.txt). Every task replays offline from data/bench_v2/har/<id>.zip
# (record / verify with `python -m tools.bench_v2`; `demo.cli_bench --live` ignores the snapshots).
#
# Fields: id, start_url, goal, tags (icon | vague | long | multistep | normal), max_steps, check (url_contains / url_regex /
# text_contains on the final page), answer_regex (done(answer) must match; success = check AND answer), har, and the
# scripted solution used by tools.bench_v2: path (steps), answer, wrong (extra branches to record).
#
# Full sweep (3 repeats; resumable, a finished run is skipped):
#   uv run --extra demo python -m demo.cli_bench --out runs/bench-v2 --tasks-file demo/tasks_v2.yaml \
#     --agents claude:claude-sonnet-5-5 codex:gpt-6.2-sol claude:claude-haiku-5-5 codex:gpt-6.1-terra \
#     --arms a11y-cap vision find@exact find@blend:dist/xs-s0:8 --repeats 3 --parallel 4
# Frozen: data/bench_v2/manifest.json holds the sha256 of this file and of every snapshot.
# Generated from the task list in tools/ authoring notes; edit the YAML directly from here on.
- id: fastapi-release-0100
