# Read-only navigation / search tasks on stable public sites. No logins, purchases or state-changing forms.
# `check` is evaluated on the final page; every key must hold. Keys: url_contains, url_regex, text_contains
# (page text, case-insensitive).
- id: wiki-search-turing
  start_url: https://en.wikipedia.org/wiki/Main_Page
  goal: Use the search box to find the Wikipedia article on Alan Turing and open it.
  check: {url_contains: /wiki/Alan_Turing}
  max_steps: 8
- id: wiki-current-events
  start_url: https://en.wikipedia.org/wiki/Main_Page
  goal: Open the Wikipedia portal that lists current events.
  check: {url_contains: Portal:Current_events}
  max_steps: 6
- id: wiki-python-creator
  start_url: https://en.wikipedia.org/wiki/Python_(programming_language)
  goal: Open the Wikipedia article about the creator of the Python language.
  check: {url_contains: Guido_van_Rossum}
  max_steps: 6
- id: wiki-moon-talk
  start_url: https://en.wikipedia.org/wiki/Moon
  goal: Open the Talk page (the discussion page) of this article.
  check: {url_contains: Talk:Moon}
  max_steps: 6
- id: wiki-moon-history
  start_url: https://en.wikipedia.org/wiki/Moon
  goal: Open the revision history of this article.
  check: {url_contains: action=history}
  max_steps: 6
- id: wiki-turing-machine
  start_url: https://en.wikipedia.org/wiki/Alan_Turing
  goal: Open the Wikipedia article about the Turing machine.
  check: {url_contains: /wiki/Turing_machine, text_contains: mathematical model of computation}
  max_steps: 8
- id: pydocs-venv
  start_url: https://docs.python.org/3/
  goal: Find the documentation page of the venv module (creation of virtual environments) in the Python standard library.
  check: {url_contains: library/venv.html}
  max_steps: 8
- id: pydocs-whatsnew
  start_url: https://docs.python.org/3/
  goal: Open the "What's New in Python" document for the latest release.
  check: {url_regex: 'whatsnew/3\.\d+\.html'}
  max_steps: 6
- id: pyorg-windows
  start_url: https://www.python.org/
  goal: Go to the page with the Python releases for Windows.
  check: {url_contains: /downloads/windows}
  max_steps: 6
- id: pep-zen
  start_url: https://peps.python.org/pep-0000/
  goal: Open PEP 20, "The Zen of Python".
  check: {url_contains: pep-0020}
  max_steps: 6
- id: mdn-array-map
  start_url: https://developer.mozilla.org/en-US/
  goal: Find the reference page of the JavaScript Array.prototype.map() method.
  check: {url_contains: Global_Objects/Array/map}
  max_steps: 8
- id: mdn-flexbox
  start_url: https://developer.mozilla.org/en-US/docs/Web/CSS
  goal: Open the documentation about CSS flexible box layout (flexbox).
  check: {url_regex: '(?i)flexbox|flexible_box'}
  max_steps: 8
- id: github-cpython-issues
  start_url: https://github.com/python/cpython
  goal: Open the list of issues of this repository.
  check: {url_contains: /python/cpython/issues}
  max_steps: 6
- id: github-flask-license
  start_url: https://github.com/pallets/flask
  goal: Open the license file of this repository.
  check: {url_regex: pallets/flask/blob/.+/LICENSE}
  max_steps: 6
- id: github-requests-releases
  start_url: https://github.com/psf/requests
  goal: Open the releases page of this repository.
  check: {url_contains: /psf/requests/releases}
  max_steps: 6
- id: arxiv-attention
  start_url: https://arxiv.org/
  goal: Search arXiv for the paper "Attention Is All You Need" and open its abstract page.
  check: {url_contains: arxiv.org/abs/1706.03762}
  max_steps: 8
- id: arxiv-cs-list
  start_url: https://arxiv.org/
  goal: Open the list of Computer Science papers.
  check: {url_contains: /list/cs}
  max_steps: 6
- id: osm-map-features
  start_url: https://wiki.openstreetmap.org/wiki/Main_Page
  goal: Open the wiki page "Map features".
  check: {url_contains: Map_features}
  max_steps: 8
# Added for the CLI-agent benchmark: stable non-Wikipedia sites (docs, repos, standards, news, government, wikis).
- id: pydocs-sorting-howto
  start_url: https://docs.python.org/3/
  goal: "Find the HOWTO guide that explains how to sort lists and other data in Python and open it."
  check: {url_contains: "howto/sorting.html"}
  max_steps: 8
- id: pydocs-glossary
  start_url: https://docs.python.org/3/
  goal: "Open the glossary that defines Python terminology."
  check: {url_contains: "/glossary.html"}
  max_steps: 6
- id: pydocs-search-pathlib
  start_url: https://docs.python.org/3/
  goal: "Use the documentation search box to look for pathlib and open the page of the pathlib module in the standard library."
  check: {url_contains: "library/pathlib.html"}
  max_steps: 8
- id: mdn-http-status
  start_url: https://developer.mozilla.org/en-US/docs/Web/HTTP
  goal: "Open the reference page that lists the HTTP response status codes."
  check: {url_regex: "Web/HTTP/(Reference/)?Status/?$"}
  max_steps: 8
- id: mdn-fetch-api
  start_url: https://developer.mozilla.org/en-US/docs/Web/API
  goal: "Open the documentation of the Fetch API."
  check: {url_contains: "/docs/Web/API/Fetch_API"}
  max_steps: 8
- id: github-numpy-pulls
  start_url: https://github.com/numpy/numpy
  goal: "Open the list of pull requests of this repository."
  check: {url_contains: "/numpy/numpy/pulls"}
  max_steps: 6
- id: github-django-tags
  start_url: https://github.com/django/django
  goal: "Open the page that lists the tags of this repository."
  check: {url_contains: "/django/django/tags"}
  max_steps: 6
- id: github-ripgrep-actions
  start_url: https://github.com/BurntSushi/ripgrep
  goal: "Open the Actions tab (the CI workflow runs) of this repository."
  check: {url_contains: "/BurntSushi/ripgrep/actions"}
  max_steps: 6
- id: arxiv-about
  start_url: https://arxiv.org/
  goal: "Open the page that explains what arXiv is (its mission and history)."
  check: {url_contains: "arxiv.org/about"}
  max_steps: 6
- id: weather-gov-alerts
  start_url: https://www.weather.gov/
  goal: "Open the page of current weather watches and warnings (active alerts)."
  check: {url_regex: "alerts\\.weather\\.gov|weather\\.gov/(alerts|wwamap|alert)"}
  max_steps: 8
- id: nasa-missions
  start_url: https://www.nasa.gov/
  goal: "Open the page that lists NASA's missions."
  check: {url_regex: "nasa\\.gov/(nasa-)?missions"}
  max_steps: 6
- id: archive-wayback
  start_url: https://archive.org/
  goal: "Open the Wayback Machine (the web archive) page."
  check: {url_contains: "web.archive.org"}
  max_steps: 6
- id: osm-wiki-key-amenity
  start_url: https://wiki.openstreetmap.org/wiki/Main_Page
  goal: "Use the wiki search to find the page about the 'amenity' key and open it."
  check: {url_contains: "Key:amenity"}
  max_steps: 8
- id: rfc-9110
  start_url: https://www.rfc-editor.org/
  goal: "Open the RFC document 'HTTP Semantics' (RFC 9110)."
  check: {url_contains: "rfc9110"}
  max_steps: 8
- id: rust-book
  start_url: https://www.rust-lang.org/
  goal: "Find and open the online book that teaches the Rust programming language (known as 'the book')."
  check: {url_contains: "doc.rust-lang.org/book"}
  max_steps: 8
- id: numpy-broadcasting
  start_url: https://numpy.org/
  goal: "Find the NumPy documentation page that explains broadcasting."
  check: {url_contains: "broadcasting"}
  max_steps: 8
- id: nodejs-fs-api
  start_url: https://nodejs.org/
  goal: "Open the Node.js API reference page of the file system ('fs') module."
  check: {url_contains: "api/fs"}
  max_steps: 8
- id: k8s-pods
  start_url: https://kubernetes.io/docs/home/
  goal: "Find the documentation page that explains what a Pod is."
  check: {url_contains: "concepts/workloads/pods"}
  max_steps: 8
- id: pydocs-tutorial-datastructures
  start_url: https://docs.python.org/3/tutorial/
  goal: "Open the tutorial chapter about data structures (lists, tuples, dictionaries, sets)."
  check: {url_contains: "tutorial/datastructures.html"}
  max_steps: 6
- id: pyorg-devguide
  start_url: https://www.python.org/
  goal: "Open the Python Developer's Guide, the handbook for people who contribute to CPython."
  check: {url_contains: "devguide.python.org"}
  max_steps: 8
