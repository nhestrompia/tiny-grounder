# Agent benchmark v5 slice: harder frozen shop/app tasks for Plan v4 step 2.
# v4's 23 tasks already score 22-23/23 on every arm, so v5 pushes the same
# mechanics further: long 8-15-ACTION sessions (click/type/select/press/goto —
# wait/scroll steps do not count) where re-sent snapshots pile up, icon-only
# controls and vague goals. Same sites and replay machinery as v4 (v4 is
# unchanged); wrong routes make each archive cover plausible alternative paths.
# Fields, step types and conventions: identical to demo/tasks_v4.yaml, plus
# check.text_not_contains for end states defined by an absence.
# Record and verify without an LLM:
#   uv run python -m tools.bench_v2 record --tasks-file demo/tasks_v5.yaml --out data/bench_v5 --branches 6
#   uv run python -m tools.bench_v2 verify --tasks-file demo/tasks_v5.yaml --out data/bench_v5
#   uv run python -m tools.bench_v2 manifest --tasks-file demo/tasks_v5.yaml --out data/bench_v5
# Freeze hashes: data/bench_v5/manifest.json. Scripted replay is not an agent-arm evaluation.

# --- saucedemo.com: login-gated shop; icon-only cart link and burger menu ---
- id: saucedemo-checkout-swap-items
  start_url: https://www.saucedemo.com/
  goal: Put the backpack and the bike light in the cart, change your mind about the light, put the cheapest kids' item in instead, and go through checkout to the order overview.
  tags: [multistep, app, icon, vague]
  max_steps: 18
  allow_actions: true
