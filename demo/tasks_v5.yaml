  - click: {css: "a.shopping_cart_link"}
  - click: {css: "#checkout"}
  - type: {css: "#first-name"}
    text: Katherine
  - type: {css: "#last-name"}
    text: Johnson
  - type: {css: "#postal-code"}
    text: "20001"
  - click: {css: "#continue"}
  answer: Order overview shows the backpack and the onesie.
  wrong: []
