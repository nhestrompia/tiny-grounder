    url_regex: ^https://www\.saucedemo\.com/checkout-step-two\.html
    text_regex: "(?s)(?=.*Sauce Labs Backpack)(?=.*Sauce Labs Onesie)"
    text_not_contains: Sauce Labs Bike Light
  har: data/bench_v5/har/saucedemo-checkout-swap-items.zip
  path:
