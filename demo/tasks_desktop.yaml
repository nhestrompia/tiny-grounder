# Held-out macOS next-step tasks (evaluation set D), frozen before any app is dumped.
# Apps are absent from data/leakage/train_apps.txt and exclude messaging, mail, credentials,
# banking, camera and account-backed personal data. Every path is reversible: documents are
# unsaved throwaways, Clock timers are cancelled/reset, and Disk Utility is read-only.
#
# Schema:
#   id, app, goal, tags, path
#   optional prepare: key chords sent after activation but before the first oracle step
#   path step: action (click/type/select/key), target, plus text/key/option when needed
#   target: role plus label or description; optional nth (1-based among matches). Role+nth alone is
#   allowed only for a value-bearing control with no stable accessible name.
# Roles are tiny-grounder record roles (button, textbox, searchbox, combobox, tab, other, ...).

# --- Font Book: read-only font browsing and previewing; no collections or fonts changed ---
- id: fontbook-code-preview
  app: Font Book
  goal: Find a monospace typeface that would work for programming and look at its sample letters.
  tags: [multistep, read-only, goal-only]
  path:
  - action: click
    target: {role: textbox, label: Search}
  - action: key
    target: {role: textbox, label: Search}
    key: cmd+f
  - action: type
    target: {role: textbox, label: Search}
    text: Courier New
  - action: click
