# Agent benchmark v4 hard slice: frozen shop/app tasks for Plan v4 step 2.
# Unlike v2/v3 (developer docs where keyword matching suffices), these are
# commerce and app-control pages with icon-only controls, form flows and
# vague goals. Most paths run 8-15 steps so re-sent snapshots pile up.
# Fields: id, start_url, goal, tags (multistep; vague for descriptive goals;
# icon for tasks whose path needs an icon-only control; app for app-style
# pages; long for pages with over 12000 visible characters), max_steps
# (= path length + 3), check (strict final URL and/or page text),
# allow_actions (opt-in: task involves login/forms/checkout, so the click-
# safety refusals and the read-only agent prompt are relaxed for it),
# answer_regex (case-insensitive fact required in done(answer) and frozen
# page), har (offline HAR zip), path (scripted steps), answer.
# Steps: click{type{locator,text,enter},select{locator,option:{label|value|index}},
# press, wait, scroll, goto, external}. Domains exclude training and v1/v2/v3 sites.
# Record and verify without an LLM:
#   uv run python -m tools.bench_v2 record --tasks-file demo/tasks_v4.yaml --out data/bench_v4 --branches 0
#   uv run python -m tools.bench_v2 verify --tasks-file demo/tasks_v4.yaml --out data/bench_v4
#   uv run python -m tools.bench_v2 manifest --tasks-file demo/tasks_v4.yaml --out data/bench_v4
# Freeze hashes: data/bench_v4/manifest.json. Scripted replay is not an agent-arm evaluation.

# --- saucedemo.com: login-gated shop; icon-only cart link and burger menu ---
- id: saucedemo-checkout-backpack
  start_url: https://www.saucedemo.com/
  goal: Add a Sauce Labs Backpack to the cart and go through checkout to the order overview.
  tags: [multistep, app, icon]
  max_steps: 14
  allow_actions: true
  check:
    url_regex: ^https://www\.saucedemo\.com/checkout-step-two\.html
    text_contains: Sauce Labs Backpack
  har: data/bench_v4/har/saucedemo-checkout-backpack.zip
  path:
  - type: {css: "#user-name"}
    text: standard_user
  - type: {css: "#password"}
    text: secret_sauce
  - click: {css: "#login-button"}
  - click: {css: "#add-to-cart-sauce-labs-backpack"}
  - click: {css: "a.shopping_cart_link"}
  - click: {css: "#checkout"}
  - type: {css: "#first-name"}
    text: Ada
  - type: {css: "#last-name"}
    text: Lovelace
  - type: {css: "#postal-code"}
    text: "12345"
  - click: {css: "#continue"}
  answer: Order overview shows the backpack.
  wrong: []
