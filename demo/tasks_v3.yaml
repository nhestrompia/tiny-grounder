# Agent benchmark v3: frozen held-out multistep tasks for Plan v3 steps 4-5.
# Each path uses 2-5 page navigations. max_steps = path length + 3.
# Fields: id, start_url, goal, tags (multistep; vague for descriptive goals;
# long for pages with over 12000 visible characters), max_steps, check (strict final URL),
# answer_regex (case-insensitive fact required in done(answer) and frozen page),
# har (offline HAR zip), path (scripted clicks), answer, wrong (recorded alternate paths).
# Domains exclude training, v1/v2 tasks, and human select/confirm pages.
# Record and verify without an LLM:
#   uv run python -m tools.bench_v2 record --tasks-file demo/tasks_v3.yaml --out data/bench_v3 --branches 0
#   uv run python -m tools.bench_v2 verify --tasks-file demo/tasks_v3.yaml --out data/bench_v3
#   uv run python -m tools.bench_v2 manifest --tasks-file demo/tasks_v3.yaml --out data/bench_v3
# Milestone sweep (run only after freezing, not part of authoring):
#   uv run --extra demo python -m demo.cli_bench --tasks-file demo/tasks_v3.yaml --out runs/bench-v3 \
#     --agents claude:claude-haiku-5-5 claude:claude-sonnet-5-5 codex:gpt-6-luna codex:gpt-6.1-terra \
#     --arms a11y-cap vision find@exact find+observe@exact find+observe@exact+blend:dist/xs-s0:8 --repeats 1
# Freeze hashes: data/bench_v3/manifest.json. Scripted replay is not an agent-arm evaluation.
